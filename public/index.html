<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07080A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command Center">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<title>Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: trading-terminal command center. Desktop = left rail + two-column dashboard; phone = single column + bottom tab bar.
   Deliberately dark-only: near-black panels, neon mint for live/positive, hot pink-red for negative, mono for every number. */
:root{
  --bg:#07080A; --surface:#0E1013; --surface-2:#15181D; --line:#1D2128; --line-2:#2A3038;
  --ink:#F3F5F8; --ink-2:#9AA3B0; --ink-3:#5F6875;
  --accent:#7C83FF; --accent-ink:#FFFFFF; --accent-soft:rgba(124,131,255,.14); --accent-2:#B36BFF; --live:#3DF5A8;
  --good:#3DF5A8; --good-soft:rgba(61,245,168,.11);
  --warn:#FFB547; --warn-soft:rgba(255,181,71,.12);
  --crit:#FF4D6D; --crit-soft:rgba(255,77,109,.12);
  --info:#4CC9FF; --info-soft:rgba(76,201,255,.13);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 12px 32px rgba(0,0,0,.45);
  --f-display:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:12px; --r-sm:9px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4.6vw,2.3rem);font-weight:650;letter-spacing:-.035em}
h2{font-size:.98rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:.84rem}
.tiny{font-size:.76rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--surface-2);color:var(--accent);border:1px solid rgba(61,245,168,.35);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.72rem;flex:none;box-shadow:0 0 18px rgba(61,245,168,.16)}
.brand-name{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font-family:var(--f-mono);font-size:.92rem;color:var(--ink-2)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-3);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync[data-s="saved"] i{background:var(--good)} .sync[data-s="saving"] i{background:var(--accent)} .sync[data-s="error"] i{background:var(--crit)} .sync[data-s="local"] i{background:var(--warn)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn svg,.tab svg,.rail a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail{display:none}
main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--ink-3);font-size:.68rem;font-weight:600;border-radius:10px;min-width:0}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:960px){
  .app{grid-template-columns:212px 1fr;column-gap:28px}
  .top{grid-column:1/-1}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;padding-top:18px}
  .rail a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600}
  .rail a:hover{background:var(--surface);color:var(--ink)}
  .rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail .rail-foot{margin-top:18px;padding:12px;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-3)}
  .tabbar{display:none}
  main{padding-bottom:48px}
}

/* building blocks */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr;gap:14px}
.grid-today{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.grid-2{grid-template-columns:1fr 1fr}}
@media (min-width:1100px){.grid-today{grid-template-columns:1.15fr .85fr;align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head .eyebrow{margin-bottom:2px}
.divider{height:1px;background:var(--line);margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{color:var(--crit)}
.btn-sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.86rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--ink-2);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.95rem;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:80px;line-height:1.45}
input[type=number]{font-family:var(--f-mono)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form>input[type=text]{flex:1 1 200px}
.inline-form>select{flex:0 1 140px;width:auto}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:16px;color:var(--ink-2);font-size:.9rem;text-align:left}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.74rem;color:var(--ink-3);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
.tbl td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl td:first-child{font-family:var(--f-body)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.total td{font-weight:700;background:var(--surface-2)}
.neg{color:var(--crit)} .pos{color:var(--good)}

/* now card */
.now{background:linear-gradient(160deg,var(--surface) 0%,var(--surface) 55%,var(--accent-soft) 100%)}
.now-label{font-family:var(--f-display);font-stretch:118%;font-weight:760;font-size:clamp(1.25rem,3.6vw,1.6rem);line-height:1.15;margin:4px 0 8px}
.now-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.86rem;color:var(--ink-2)}
.timeline{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;gap:2px;max-height:260px;overflow:auto}
.tl{display:grid;grid-template-columns:68px 1fr;gap:10px;font-size:.84rem;padding:4px 0;color:var(--ink-2)}
.tl .t{font-family:var(--f-mono);color:var(--ink-3)}
.tl.cur{color:var(--ink);font-weight:600}
.tl.cur .t{color:var(--accent)}
.tl.past{opacity:.5}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:7px;border:1.6px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;color:transparent}
.chk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.task.done .chk{background:var(--good);border-color:var(--good);color:var(--bg)}
.task-title{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;cursor:pointer;color:var(--ink);font-size:.93rem;overflow-wrap:anywhere}
.task.done .task-title{color:var(--ink-3);text-decoration:line-through}
.area{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.area[data-a="docstar"]{color:var(--accent)} .area[data-a="research"]{color:var(--info)} .area[data-a="body"],.area[data-a="gym"]{color:var(--good)}

/* ai */
.ai-out{font-size:.93rem;line-height:1.55;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.ai-out ul,.ai-out ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.ai-out h4{font-size:.92rem;margin-top:4px}
.ai-out code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.tag{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;vertical-align:1px}
.tag-verified{background:var(--good-soft);color:var(--good)} .tag-assumption{background:var(--warn-soft);color:var(--warn)} .tag-opinion{background:var(--info-soft);color:var(--info)}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.9rem}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.8}}

/* proposals */
.proposal{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px}
.proposal ul{margin:8px 0 12px;padding-left:1.15em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}

/* chat */
.chat-layout{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:1100px){.chat-layout{grid-template-columns:280px 1fr}}
.threads{display:flex;flex-direction:column;gap:4px}
.thread-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer;min-width:0}
.thread-btn:hover{background:var(--surface-2)}
.thread-btn[aria-current="true"]{background:var(--surface-2);border-color:var(--line-2)}
.thread-btn b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.msgs{display:flex;flex-direction:column;gap:12px;min-height:200px}
.msg{max-width:min(720px,100%);padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.msg.user{align-self:flex-end;background:var(--accent-soft);border-color:transparent;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.assistant{align-self:flex-start;background:var(--surface)}
.msg-tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.composer textarea{min-height:76px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.mode[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* workout */
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.ex-name{font-weight:700}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:6px 8px;align-items:center;margin-top:10px}
.sets .h{font-size:.7rem;color:var(--ink-3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sets .n{font-family:var(--f-mono);color:var(--ink-3);font-size:.85rem}
.sets input{padding:7px 9px}

/* opps */
.opp{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.opp:hover{border-color:var(--line-2)}
.opp-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.prio{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.factbox{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.factbox{grid-template-columns:1fr 1fr}}

/* funnel */
.funnel-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.funnel-row:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:86px;text-align:center}

/* chart */
.chart svg{width:100%;height:auto;display:block}

/* learn */
.lesson p{max-width:68ch}
.formula{font-family:var(--f-mono);font-size:.88rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap}
.quiz-q{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.quiz-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.9rem}
.quiz-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.quiz-opt.right{border-color:var(--good);background:var(--good-soft)}
.quiz-opt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.mod-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mod{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.6);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:min(680px,100%);max-height:92vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:18px;padding:22px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:960px){.toast{bottom:28px}}
.loading{display:grid;place-items:center;min-height:50vh;text-align:center;gap:10px}
.onb{max-width:620px;margin:0 auto}
.onb .card{padding:22px}
.note-item{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.note-item:last-child{border-bottom:0}
.hide-sm{display:none}
@media (min-width:760px){.hide-sm{display:inline}}

/* terminal finish */

(function(){

/* ================= utilities ================= */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dkey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const parseKey = k => { const p = String(k).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const money = (n, cents) => { n = num(n); const s = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0}); return (n < 0 ? '−$' : '$') + s; };
const toMin = t => { if (!t) return 0; const p = String(t).split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
const fromMin = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const fmtTime = t => { const m = toMin(t); let h = Math.floor(m / 60); const mi = m % 60; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(mi) + ' ' + ap; };
const fmtDate = k => { if (!k) return ''; const d = parseKey(k); return DOW[d.getDay()] + ' ' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate(); };
const fmtDur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60); return h ? h + 'h ' + pad(m % 60) + 'm' : m + 'm'; };
const weekStart = k => { const d = parseKey(k); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return dkey(d); };
function armed(el, label) {
  if (el.dataset.armed === '1') return true;
  const old = el.textContent; el.dataset.armed = '1'; el.textContent = label || 'Tap again to confirm';
  setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; el.textContent = old; } }, 3500);
  return false;
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600); }

const ICON = {
  today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  train:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6.5v11M18 6.5v11M21 9v6M6 12h12"/></svg>',
  money:'<svg viewBox="0 0 24 24"><path d="M12 3.5v17M16.5 7.6c-.7-1.4-2.4-2.3-4.5-2.3-2.6 0-4.4 1.3-4.4 3.1 0 4.4 9 2.3 9 6.6 0 1.9-1.9 3.2-4.6 3.2-2.3 0-4.1-.9-4.9-2.5"/></svg>',
  deals:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>',
  mentor:'<svg viewBox="0 0 24 24"><path d="M5 18.5V7a2.5 2.5 0 0 1 2.5-2.5h9A2.5 2.5 0 0 1 19 7v6.5a2.5 2.5 0 0 1-2.5 2.5H8.5L5 18.5z"/><path d="M9 9.5h6M9 12.5h4"/></svg>',
  learn:'<svg viewBox="0 0 24 24"><path d="M4.5 5.5A2 2 0 0 1 6.5 4H19v14H6.5a2 2 0 0 0-2 2V5.5z"/><path d="M4.5 20a2 2 0 0 1 2-2H19M9 8h6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>'
};
ICON.crew = '<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3 2.9-5 5.5-5s4.9 2 5.5 5"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M15.6 14.2c2.4.1 4.3 1.9 4.9 4.8"/></svg>';
let TABS = [['today','Today'],['train','Train'],['money','Money'],['deals','Deals'],['mentor','Mentor'],['learn','Learn']];

/* ================= domain constants ================= */
const STAGES = ['Idea','Researching','Setting up','Analyzing','Verified','Active','Back burner','Rejected'];
const STAGE_TONE = {'Idea':'','Researching':'info','Setting up':'accent','Analyzing':'info','Verified':'good','Active':'good','Back burner':'','Rejected':'crit'};
const AREAS = {docstar:'Docstar', research:'Research', body:'Body', school:'School', learn:'Learn', life:'Life'};
const REPEATS = {'':'One time', daily:'Every day', weekdays:'Weekdays', gym:'Gym days', sun:'Sundays'};
const DAYS_OPTS = {all:'Every day', weekdays:'Weekdays', weekend:'Weekend', gym:'Gym days', rest:'Rest days', sun:'Sundays'};
const FUNNEL = [
  {k:'companies', label:'Companies researched', target:30},
  {k:'contacts', label:'Contacts verified', target:20},
  {k:'sent', label:'Intro emails sent', target:15},
  {k:'replies', label:'Replies'},
  {k:'interested', label:'Interested / qualified'},
  {k:'customers', label:'Paying customers won', target:1},
  {k:'revenue', label:'Revenue collected for Docstar', money:true}
];
const MODES = {
  explain:{label:'Explain it', hint:'Plain-English explanation of a concept, using your own deals as the example.'},
  prep:{label:'Prep for Dad', hint:'Get ready for a business conversation with your dad.'},
  challenge:{label:'Challenge me', hint:'Pressure-test an idea. Expect pushback.'},
  debrief:{label:'Debrief', hint:'After a talk: who had the stronger points, decisions, action items.'},
  plan:{label:'Change my plan', hint:'Reprioritize, park, or add opportunities and tasks. Changes wait for your approval.'},
  fitness:{label:'Training coach', hint:'Adjust workouts, food, and recovery based on your logs.'}
};

/* ================= learning content ================= */
const LESSONS = [
 {id:'cashflow', title:'Cash flow and profit', body:[
  'Revenue is money that comes in. Profit is revenue minus expenses for a period. Cash flow is the cash that actually moves in and out of your account, including things that are not expenses on paper, like loan principal or furniture you buy up front.',
  'A deal can show a profit on paper and still drain your bank account, or show a paper loss (because of depreciation) and still put cash in your pocket. For your decisions, the number that keeps you solvent is monthly cash flow after every payment.'],
  formula:'Monthly cash flow = cash in − (operating costs + debt payments + reserve set aside)',
  exercise:'Open Deals → Rental property with the blueprint numbers. List every line that takes money out at 20 nights. Which one would you change first, and what would it cost you in time?',
  quiz:[{q:'A rental shows $500/month profit on paper, but $700/month of loan principal is not counted as an expense. What is its cash flow?',o:['+$500','−$200','+$1,200','$0'],a:1,why:'Principal is cash leaving your account even though it is not an expense: $500 − $700 = −$200.'},
        {q:'Which number tells you whether a deal can keep paying its bills?',o:['Gross revenue','Paper profit','Cash flow after debt payments','Equity'],a:2,why:'Bills are paid with cash. Cash flow after every payment is the survival number.'}]},
 {id:'credit', title:'Business credit and financing', body:[
  'Common options: term loans (fixed payment and schedule), lines of credit (borrow, repay, borrow again, usually variable rate), equipment and auto loans (secured by the asset), mortgages and DSCR loans (secured by property, underwritten on its income), seller financing, and family loans (which should be written promissory notes).',
  'Lenders look at credit history, income, time in business, collateral, and existing debt. Early on, most business credit still needs a personal guarantee: if the business cannot pay, you do. An approval is permission to owe money, not income.'],
  formula:'Total interest paid = (monthly payment × number of payments) − amount borrowed',
  exercise:'A $40,000 loan at 12% for 5 years. Put it in Deals → Other business (loan payment: calculate). What is the payment, and how much revenue would a business need just to cover it at a 35% cost ratio?',
  quiz:[{q:'You personally guarantee an LLC loan and the LLC fails. Who owes the balance?',o:['Nobody, the LLC is gone','The bank absorbs it','You do','The state'],a:2,why:'A personal guarantee makes you liable when the business cannot pay.'},
        {q:'A $40,000 line of credit is approved. What has changed in your income?',o:['+$40,000','Nothing','+$40,000 minus interest','It depends on taxes'],a:1,why:'Borrowed money must be repaid. It is not income.'}]},
 {id:'debt', title:'Interest and debt service', body:[
  'Debt service is the total of loan payments due in a period: interest plus principal. Interest is the price of borrowing; principal is paying back what you borrowed.',
  'Lenders compare the cash a property or business produces to its debt service. That ratio is the DSCR. Below 1.0 means it cannot cover its own payments. Many lenders want 1.20–1.25 or higher. When your dad says debt service, he means this monthly payment burden, due whether you had bookings or not.'],
  formula:'DSCR = net operating income ÷ annual debt service\nMonthly payment = L × r ÷ (1 − (1 + r)^−n)   (r = annual rate ÷ 12, n = months)',
  exercise:'A property has $24,000/year of net operating income and a $1,800/month loan payment. Compute the DSCR. Would a typical lender approve it?',
  quiz:[{q:'NOI is $24,000/yr and payments are $1,800/mo. DSCR?',o:['0.90','1.11','1.33','13.3'],a:1,why:'$1,800 × 12 = $21,600. $24,000 ÷ $21,600 ≈ 1.11, below the common 1.20–1.25 minimum.'},
        {q:'Debt service includes:',o:['Only interest','Only principal','Interest and principal','Insurance and taxes'],a:2,why:'Debt service is the full loan payment: interest plus principal.'}]},
 {id:'leverage', title:'Leverage and risk', body:[
  'Leverage means using borrowed money so a small amount of your cash controls a bigger asset. It multiplies results in both directions. If the asset earns more than the debt costs, your return on cash goes up. If it earns less, losses speed up, and the payment is due in empty months too.',
  'Stacking loans (using one loan to qualify for the next) piles up fixed payments without creating income. Leverage belongs after a business proves it can pay the debt from its own cash flow, with reserves for bad months.'],
  formula:'Cash-on-cash return = annual pre-tax cash flow ÷ total cash you invested',
  exercise:'You put $20,000 down on a $100,000 asset. Year 1 it nets $3,000. What is your cash-on-cash return? Now it nets −$2,000. What happened to your money?',
  quiz:[{q:'$20,000 invested, $3,000 annual cash flow. Cash-on-cash?',o:['3%','15%','20%','30%'],a:1,why:'$3,000 ÷ $20,000 = 15%.'},
        {q:'When does leverage hurt you most?',o:['When the asset earns more than the loan costs','When income drops but payments stay fixed','When rates fall','Never, if you have good credit'],a:1,why:'Fixed payments keep coming when income falls. That is how leverage accelerates losses.'}]},
 {id:'underwriting', title:'Real estate underwriting', body:[
  'Underwriting is checking whether a property’s numbers hold up before you buy. Start with gross potential rent, subtract vacancy, then operating expenses (taxes, insurance, utilities, repairs, management, HOA) to get net operating income, NOI. Subtract debt service to get cash flow.',
  'Cap rate (NOI ÷ price) lets you compare properties regardless of financing. Verify every input with real rent comps, tax bills, insurance quotes, and an inspection. Run the stress case before the optimistic one.'],
  formula:'NOI = gross income − vacancy − operating expenses\nCap rate = NOI ÷ purchase price',
  exercise:'A $300,000 property rents for $2,600/month, with 5% vacancy and $9,000/year of expenses. Find NOI and cap rate.',
  quiz:[{q:'$2,600/mo rent, 5% vacancy, $9,000/yr expenses. NOI?',o:['$31,200','$22,200','$20,640','$29,640'],a:2,why:'$31,200 × 0.95 = $29,640; minus $9,000 = $20,640.'},
        {q:'Cap rate ignores:',o:['Rent','Operating expenses','Financing','Vacancy'],a:2,why:'Cap rate is NOI ÷ price, before any loan payments.'}]},
 {id:'str', title:'Short-term rental markets', body:[
  'STR income = nightly rate × booked nights, minus platform fees, cleaning, management, supplies, utilities, and higher wear. Occupancy swings with seasons, events, and new competition.',
  'The biggest risk is legal. Many cities restrict or ban STRs, require permits, or limit them to primary residences; HOAs and lenders can forbid them too. Third-party tools estimate occupancy from listings, not owners’ actual books. Always check the long-term rent fallback: if the STR fails, can a regular tenant cover the payment?'],
  formula:'Break-even nights = monthly fixed costs ÷ (nightly rate × (1 − platform % − manager %))',
  exercise:'In Deals → Rental property, enter the blueprint example. How many nights to break even? (Your blueprint estimated about 24.)',
  quiz:[{q:'Fixed costs $3,000/mo, $200/night, 15.5% + 20% fees. Break-even nights?',o:['15','20','24','30'],a:2,why:'$200 × 0.645 = $129 per night. $3,000 ÷ $129 ≈ 23.3, so 24 nights.'},
        {q:'What should you verify first in a new STR market?',o:['Average nightly rate','Whether STRs are legal there','Instagram demand','Furniture costs'],a:1,why:'If it is not legal to operate, no other number matters.'}]},
 {id:'cars', title:'Car rental operations', body:[
  'Peer-to-peer rental pays the host a share of each trip after the platform’s cut, which depends on the protection plan. Costs: the loan, rental-appropriate insurance, cleaning, delivery time, tires and brakes (performance cars wear fast), depreciation from mileage, and downtime for repairs.',
  'Many personal auto loans and policies prohibit rental use. Disclose it to the lender and insurer. Demand depends on city, season, and model; enthusiast appeal does not equal bookings.'],
  formula:'Monthly cash flow = days × daily rate × host share − (payment + insurance + wear reserve + cleaning)',
  exercise:'For the blueprint car ($250/day, 70% host share, $2,300/month fixed), find the booked days needed to break even.',
  quiz:[{q:'$250/day, 70% host share, $2,300/mo fixed costs. Break-even days?',o:['9.2','13.1','18','23'],a:1,why:'$250 × 0.7 = $175 per day. $2,300 ÷ $175 ≈ 13.1 days.'},
        {q:'Hiding rental use from your lender or insurer is:',o:['A common shortcut','Fine if you pay on time','Misrepresentation that can void coverage','Only an issue in California'],a:2,why:'It can void coverage and break your loan terms. Your blueprint rules it out.'}]},
 {id:'structures', title:'Business structures', body:[
  'Sole proprietorship: you and the business are the same. Simplest, no liability shield. LLC: a separate legal entity that can limit personal liability if you run it properly (separate bank account, contracts in its name). In California, every LLC owes an $800 minimum franchise tax each year.',
  'An S-corp is a tax election, not an entity, and can make sense at higher profits. Multi-owner deals need a written operating agreement: who contributes what, who decides, how profit and loss split, and what happens if someone exits. This is education only; use a CPA or attorney before forming anything.'],
  formula:'Rule: an entity protects you only if business and personal money stay separate.',
  exercise:'For a possible family land deal, write the five questions an operating agreement must answer before money moves.',
  quiz:[{q:'California LLC minimum annual tax:',o:['$0','$100','$800','$1,600'],a:2,why:'California charges every LLC an $800 minimum franchise tax each year.'},
        {q:'An S-corp is:',o:['A type of LLC','A tax election','A loan program','A bank account'],a:1,why:'S-corp status is a tax election an LLC or corporation can make.'}]},
 {id:'taxes', title:'Taxes and compliance (educational)', body:[
  'Business profit is taxed as income, and self-employed people also pay self-employment tax (15.3% on most net earnings) for Social Security and Medicare. Set aside 25–30% of profit until a CPA gives you a real number. Commission income from Docstar may be reported to you on a 1099.',
  'A deduction lowers taxable income but still costs real money: a $1,000 deductible expense saves only your tax rate on it. Property held over a year is usually a long-term capital gain; under a year is taxed like ordinary income. Keep receipts, mileage logs, and separate accounts from day one.'],
  formula:'Tax saved by a deduction ≈ deduction × your marginal tax rate',
  exercise:'You earn $2,000 in commissions this month. How much should go into a tax savings account? Log both in Money → Ledger.',
  quiz:[{q:'You spend $1,000 on a deductible expense at a 22% tax rate. Net cost?',o:['$0','$220','$780','$1,000'],a:2,why:'You save $220 in tax, so the expense still costs $780.'},
        {q:'Self-employment tax rate on most net earnings:',o:['7.65%','10%','15.3%','22%'],a:2,why:'15.3% covers both halves of Social Security and Medicare.'}]},
 {id:'negotiation', title:'Negotiation and decisions', body:[
  'Know your walk-away point (your best alternative if there is no deal) before you talk. Ask questions before stating positions; whoever understands the other side’s constraints usually gets the better deal. Anchor with evidence, not hype.',
  'With family partners especially, put terms in writing so disagreements are about the document, not each other. For any decision, write down the base case, the worst case, what would change your mind, and when you will review it.'],
  formula:'Pre-decision check: base case · worst case · max loss you can absorb · reversible? · review date',
  exercise:'Prepare a 5-minute pitch to your dad for the Docstar commission arrangement using the pre-decision check. Try it in Mentor → Prep for Dad.',
  quiz:[{q:'Before a negotiation, the most important thing to know is:',o:['Their opening offer','Your walk-away point','The market average','Who talks first'],a:1,why:'Your best alternative sets the point where you say no.'},
        {q:'Why put a family deal in writing?',o:['Because you don’t trust them','Courts require it','So disagreements are about terms, not each other','It lowers taxes'],a:2,why:'Clear written terms protect the relationship as much as the money.'}]}
];

const CALC = {
 str:{label:'Rental property', sub:'Airbnb / short-term rental', groups:[

function calcDefaults(type) { const o = {}; CALC[type].groups.forEach(g => g.fields.forEach(f => { o[f[0]] = f[3]; })); return o; }
function pmt(L, ratePct, years) { const n = Math.round(num(years) * 12); L = num(L); if (!L || !n) return 0; const r = num(ratePct) / 100 / 12; if (!r) return L / n; return L * r / (1 - Math.pow(1 + r, -n)); }

function compute(type, v) {
  const R = {rows:[], metrics:[], verdict:'', tone:''};
  const head = (labels) => R.cols = labels;
  if (type === 'str') {
    const loan = v.price * (1 - v.downPct / 100);
    const debt = v.debtMode === 'calc' ? pmt(loan, v.rate, v.termYrs) : num(v.debtDirect);
    const sc = n => { const g = v.nightly * n, fee = g * v.platformPct / 100, mg = g * v.mgmtPct / 100; return {n, g, fee, mg, cf: g - fee - mg - debt - v.otherMonthly}; };
    const W = sc(v.nightsWeak), B = sc(v.nightsBase), S2 = sc(v.nightsStrong);
    head(['Weak','Normal','Strong']);
    R.rows = [
      ['Nights booked', W.n, B.n, S2.n, 'n'], ['Guest revenue', W.g, B.g, S2.g, '$'], ['Platform fee', -W.fee, -B.fee, -S2.fee, '$'], ['Manager', -W.mg, -B.mg, -S2.mg, '$'],
      ['Loan payment', -debt, -debt, -debt, '$'], ['Other + reserve', -v.otherMonthly, -v.otherMonthly, -v.otherMonthly, '$'], ['Cash flow / month', W.cf, B.cf, S2.cf, '$', 'total'], ['Cash flow / year', W.cf*12, B.cf*12, S2.cf*12, '$']];
    const perNight = v.nightly * (1 - (v.platformPct + v.mgmtPct) / 100);
    const be = perNight > 0 ? (debt + v.otherMonthly) / perNight : Infinity;
    const startup = v.price * v.downPct / 100 + v.closing + v.furnish;
    R.metrics = [['Break-even nights', isFinite(be) ? Math.ceil(be) + ' / mo' : 'Never'], ['Startup cash', money(startup)], ['Loan payment', money(debt)], ['Cash-on-cash (normal)', startup > 0 ? (B.cf * 12 / startup * 100).toFixed(1) + '%' : '—']];
    if (W.cf < 0) R.metrics.push(['Reserve lasts (weak months)', v.reserveCash > 0 ? (v.reserveCash / -W.cf).toFixed(1) + ' mo' : '0 mo']);
    if (v.ltRent > 0) R.metrics.push(['Long-term fallback / mo', money(v.ltRent - debt - v.ltCosts)]);
    if (Math.max(v.nightsWeak, v.nightsBase, v.nightsStrong) > 30) R.warn = 'A month has at most 30–31 nights.';
    verdict(R, W.cf, B.cf, S2.cf);
  } else if (type === 'car') {
    const loan = v.price * (1 - v.downPct / 100);
    const debt = v.debtMode === 'calc' ? pmt(loan, v.rate, v.termYrs) : num(v.debtDirect);
    const fixed = debt + v.insurance + v.wearReserve;
    const sc = n => { const g = v.dailyRate * n, host = g * v.hostSharePct / 100, trips = v.avgTripDays > 0 ? n / v.avgTripDays : 0, clean = trips * v.cleaningPerTrip; return {n, g, host, clean, cf: host - fixed - clean}; };
    const W = sc(v.daysWeak), B = sc(v.daysBase), S2 = sc(v.daysStrong);
    head(['Weak','Normal','Strong']);
    R.rows = [['Days booked', W.n, B.n, S2.n, 'n'], ['Gross bookings', W.g, B.g, S2.g, '$'], ['Your share', W.host, B.host, S2.host, '$'], ['Loan payment', -debt, -debt, -debt, '$'],
      ['Insurance', -v.insurance, -v.insurance, -v.insurance, '$'], ['Wear reserve', -v.wearReserve, -v.wearReserve, -v.wearReserve, '$'], ['Cleaning / delivery', -W.clean, -B.clean, -S2.clean, '$'],
      ['Cash flow / month', W.cf, B.cf, S2.cf, '$', 'total'], ['After depreciation', W.cf - v.depreciation, B.cf - v.depreciation, S2.cf - v.depreciation, '$']];
    const perDay = v.dailyRate * v.hostSharePct / 100 - (v.avgTripDays > 0 ? v.cleaningPerTrip / v.avgTripDays : 0);
    const be = perDay > 0 ? fixed / perDay : Infinity;
    const startup = v.price * v.downPct / 100 + v.startupOther;
    R.metrics = [['Break-even days', isFinite(be) ? be.toFixed(1) + ' / mo' : 'Never'], ['Startup cash', money(startup)], ['Loan payment', money(debt)], ['Cash-on-cash (normal)', startup > 0 ? (B.cf * 12 / startup * 100).toFixed(1) + '%' : '—']];
    if (W.cf < 0) R.metrics.push(['Reserve lasts (weak months)', v.reserveCash > 0 ? (v.reserveCash / -W.cf).toFixed(1) + ' mo' : '0 mo']);
    if (Math.max(v.daysWeak, v.daysBase, v.daysStrong) > 31) R.warn = 'A month has at most 31 days.';
    verdict(R, W.cf, B.cf, S2.cf);
  } else if (type === 'land') {
    const sc = (resale, months) => { const hold = v.holdPerMonth * months, interest = v.loanAmt * v.loanRate / 100 / 12 * months; const profit = resale - v.purchase - v.closing - hold - v.sellingCost - interest; const yours = profit * v.yourSharePct / 100; const cash = Math.max(0, v.purchase + v.closing - v.loanAmt) + hold + v.sellingCost; return {resale, months, hold, interest, profit, yours, cash}; };
    const W = sc(v.resaleWeak, v.monthsWeak), B = sc(v.resaleBase, v.monthsBase), S2 = sc(v.resaleStrong, v.monthsStrong);
    head(['Weak','Expected','Strong']);
    R.rows = [['Months to sell', W.months, B.months, S2.months, 'n'], ['Resale price', W.resale, B.resale, S2.resale, '$'], ['Purchase', -v.purchase, -v.purchase, -v.purchase, '$'], ['Closing + due diligence', -v.closing, -v.closing, -v.closing, '$'],
      ['Holding costs', -W.hold, -B.hold, -S2.hold, '$'], ['Selling + marketing', -v.sellingCost, -v.sellingCost, -v.sellingCost, '$'], ['Loan interest', -W.interest, -B.interest, -S2.interest, '$'],
      ['Pre-tax profit', W.profit, B.profit, S2.profit, '$', 'total'], ['Your share', W.yours, B.yours, S2.yours, '$']];
    const ann = B.cash > 0 && B.months > 0 ? (B.yours / B.cash) * (12 / B.months) * 100 : 0;
    R.metrics = [['Cash needed (expected)', money(B.cash)], ['Annualized return (expected)', ann.toFixed(0) + '%'], ['Worst case', money(W.yours)], ['Loan owed if unsold', money(v.loanAmt)]];
    if (W.yours < 0 && B.yours > 0) { R.verdict = 'Profitable only if it sells on time near the expected price. A slow or low sale loses money.'; R.tone = 'warn'; }
    else verdict(R, W.yours, B.yours, S2.yours, true);
  } else {
    const debt = v.debtMode === 'calc' ? pmt(v.loanAmt, v.rate, v.termYrs) : num(v.debtDirect);
    const sc = rev => { const varc = rev * v.variablePct / 100; return {rev, varc, cf: rev - varc - v.fixedMonthly - debt}; };
    const W = sc(v.revWeak), B = sc(v.revBase), S2 = sc(v.revStrong);
    head(['Weak','Normal','Strong']);
    R.rows = [['Revenue', W.rev, B.rev, S2.rev, '$'], ['Variable costs', -W.varc, -B.varc, -S2.varc, '$'], ['Fixed costs', -v.fixedMonthly, -v.fixedMonthly, -v.fixedMonthly, '$'], ['Loan payment', -debt, -debt, -debt, '$'],
      ['Cash flow / month', W.cf, B.cf, S2.cf, '$', 'total'], ['Cash flow / year', W.cf*12, B.cf*12, S2.cf*12, '$']];
    const ber = v.variablePct < 100 ? (v.fixedMonthly + debt) / (1 - v.variablePct / 100) : Infinity;
    R.metrics = [['Break-even revenue', isFinite(ber) ? money(ber) + ' / mo' : 'Never'], ['Loan payment', money(debt)], ['Payback (normal)', B.cf > 0 ? (v.startup / B.cf).toFixed(1) + ' mo' : 'Never'], ['Startup cash', money(v.startup)]];
    if (W.cf < 0) R.metrics.push(['Reserve lasts (weak months)', v.reserveCash > 0 ? (v.reserveCash / -W.cf).toFixed(1) + ' mo' : '0 mo']);
    verdict(R, W.cf, B.cf, S2.cf);
  }
  return R;
}
function verdict(R, w, b, s, isProfit) {
  const unit = isProfit ? 'profit' : 'cash flow';
  if (b < 0) { R.verdict = 'Loses money in the normal case. Reject it, or change the numbers that matter most and re-check with real quotes.'; R.tone = 'crit'; }
  else if (w < 0) { R.verdict = 'Works in normal months but loses money in weak ones. It needs a cash reserve and a plan for slow seasons.'; R.tone = 'warn'; }
  else { R.verdict = 'Positive ' + unit + ' in all three cases. Next: replace every assumption with a real quote, listing, or contract.'; R.tone = 'good'; }
}

async function initStore() {
  const C = window.claude;
  let db = null, user = null;
  if (C && typeof C.use === 'function') {
    try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) {}
    C.use('sample').then(async s => {
      AI.sample = s || null; AI.state = s ? 'on' : 'off';
      if (s) { try { const lim = await s.limits(); AI.tools = !!(lim && lim.tools); } catch (e) { AI.tools = false; } }
      scheduleRender();
    }).catch(() => { AI.state = 'off'; scheduleRender(); });

  } else { AI.state = 'off'; }
  let id = null; try { id = user ? await user.id() : null; } catch (e) {}
  if (db && id) {
    Store.mode = 'cloud'; Store.db = db; Store.uid = id;
    try {
      DOC_NAMES.forEach(n => { Store.refs[n] = db.doc('data/users/' + id + '/' + n); });
      const snaps = await Promise.all(DOC_NAMES.map(n => Store.refs[n].get()));
      snaps.forEach((s, i) => { if (s.exists) S[DOC_NAMES[i]] = clone(s.data()); });
      DOC_NAMES.forEach(n => {
        Store.refs[n].onSnapshot(snap => {
          if (Store.dirty[n] || Store.saving[n]) return;
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          if (!snap.exists) return;
          const d = snap.data();
          if (S[n] && num(d._v) <= num(S[n]._v)) return;
          S[n] = clone(d); ensureShape(); scheduleRender();
        }, err => { console.warn('sync stopped for', n, err && err.code); });
      });
      setSync('saved');

      console.warn('cloud store failed, using this device', e);
      Store.mode = 'local'; loadLocal();
    }

  if (Store.mode === 'local') setSync('local');
}
function loadLocal() { DOC_NAMES.forEach(n => { try { const raw = localStorage.getItem('cc4am:' + n); if (raw) S[n] = JSON.parse(raw); } catch (e) {} }); }
function touch(n) {
  if (!S[n]) return;
  S[n]._v = Date.now(); Store.dirty[n] = true;
  clearTimeout(Store.timers[n]); Store.timers[n] = setTimeout(() => flush(n), 450);
  setSync('saving'); scheduleRender(); schedulePublish();
}
async function flush(n, retried) {
  if (!Store.dirty[n]) return;
  if (Store.saving[n]) { clearTimeout(Store.timers[n]); Store.timers[n] = setTimeout(() => flush(n), 300); return; }
  Store.dirty[n] = false;
  const data = clone(S[n]);
  const size = JSON.stringify(data).length;
  if (size > 240000) toast('The ' + n + ' data is getting large. Export it, then clear old entries.');
  if (Store.mode === 'cloud') {
    Store.saving[n] = true;
    try { await Store.refs[n].set(data); if (!Object.values(Store.dirty).some(Boolean)) setSync('saved'); }
    catch (e) {
      const c = e && e.code;
      if (c === 'unavailable' && !retried) { Store.saving[n] = false; Store.dirty[n] = true; setTimeout(() => flush(n, true), 800 + Math.random() * 900); return; }
      setSync('error', 'Not saved');
      toast(c === 'quota_exceeded' ? 'Storage is full. Export your data and delete old entries.' : c === 'revoked' ? 'Access to saved data was turned off for this view.' : 'Couldn’t save your last change. Check your connection, then edit again.');
    } finally { Store.saving[n] = false; }
  } else {
    try { localStorage.setItem('cc4am:' + n, JSON.stringify(data)); setSync('local'); } catch (e) { setSync('error', 'Not saved'); toast('This browser blocked saving. Your changes will be lost when you close it.'); }
  }
}

function weightChart(list, goal) {
  if (list.length < 2) return '<div class="empty">Log at least two weigh-ins to see your trend line.</div>';
  const W = 640, H = 200, L = 44, R = 12, T = 14, B = 26;
  const vals = list.map(x => num(x.lb)).concat(goal ? [goal] : []);
  let lo = Math.floor(Math.min.apply(null, vals) - 1), hi = Math.ceil(Math.max.apply(null, vals) + 1);
  const t0 = parseKey(list[0].date).getTime(), t1 = parseKey(list[list.length - 1].date).getTime() || t0 + 1;
  const x = d => L + (W - L - R) * ((parseKey(d).getTime() - t0) / Math.max(1, t1 - t0)), y = v => T + (H - T - B) * (1 - (v - lo) / Math.max(1, hi - lo));
  const pts = list.map(p => x(p.date).toFixed(1) + ',' + y(num(p.lb)).toFixed(1)).join(' ');
  const ticks = []; const step = Math.max(1, Math.ceil((hi - lo) / 4)); for (let v = lo; v <= hi; v += step) ticks.push(v);
  const last = list[list.length - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Body weight trend">' +
    ticks.map(v => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="JetBrains Mono, monospace">' + v + '</text>').join('') +
    (goal && goal <= hi && goal >= lo ? '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(goal) + '" y2="' + y(goal) + '" stroke="var(--good)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="' + (W - R) + '" y="' + (y(goal) - 6) + '" text-anchor="end" font-size="11" fill="var(--good)">Goal ' + goal + ' lb</text>' : '') +
    '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(last.date) + '" cy="' + y(num(last.lb)) + '" r="4.5" fill="var(--accent)"/>' +
    '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="var(--ink-3)">' + fmtDate(list[0].date) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + fmtDate(last.date) + '</text></svg>';
}

/* ---------- markdown-lite ---------- */
function md(src) {
  const lines = esc(src).split('\n'); let html = '', list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[(Verified|Assumption|Opinion)\]/gi, (m, t) => '<span class="tag tag-' + t.toLowerCase() + '">' + t + '</span>');
  lines.forEach(raw => {
    const l = raw.replace(/\s+$/, ''); let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { if (list) html += '</' + list + '>'; html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; return; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))) { if (list !== 'ol') { if (list) html += '</' + list + '>'; html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[2]) + '</li>'; return; }
    if (list) { html += '</' + list + '>'; list = null; }
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { html += '<h4>' + inline(m[1]) + '</h4>'; return; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l) || !l.trim()) return;
    html += '<p>' + inline(l) + '</p>';
  });
  if (list) html += '</' + list + '>';
  return html;
}

function sheet(title, body) { return '<div class="sheet-head"><h2 id="modalTitle">' + title + '</h2><button class="icon-btn" data-act="closeModal" aria-label="Close">' + ICON.x + '</button></div>' + body; }

  openModal(sheet('Edit task', '<form class="stack" data-form="saveTask" data-id="' + t.id + '"><label class="f">Task<input type="text" id="te_title" value="' + esc(t.title) + '"></label><div class="fields"><label class="f">Area<select id="te_area">' + Object.keys(AREAS).map(a => '<option value="' + a + '" ' + (a === t.area ? 'selected' : '') + '>' + AREAS[a] + '</option>').join('') + '</select></label><label class="f">Repeats<select id="te_rep">' + Object.keys(REPEATS).map(r => '<option value="' + r + '" ' + (r === (t.repeat || '') ? 'selected' : '') + '>' + REPEATS[r] + '</option>').join('') + '</select></label><label class="f">Due date (one-time)<input type="date" id="te_date" value="' + esc(t.date || '') + '"></label></div><label class="f">Notes<textarea id="te_note">' + esc(t.note || '') + '</textarea></label><div class="row-between"><button class="btn btn-ghost btn-danger" type="button" data-act="rmTask" data-id="' + t.id + '">Delete task</button><button class="btn btn-primary" type="submit">Save</button></div></form>'));
}
function allTasksModal() {
  const open = S.tasks.items.filter(t => !t.repeat && !t.done).sort((a, b) => (a.date || '9') < (b.date || '9') ? -1 : 1);
  const habits = S.tasks.items.filter(t => t.repeat && !t.archived);
  const done = S.tasks.items.filter(t => !t.repeat && t.done).slice(-10).reverse();
  const row = t => '<li class="task ' + (t.done ? 'done' : '') + '"><button class="chk" data-act="toggleTask" data-id="' + t.id + '" data-k="' + dkey() + '" aria-label="Toggle done">' + ICON.check + '</button><button class="task-title" data-act="editTask" data-id="' + t.id + '">' + esc(t.title) + '</button><span class="tiny faint mono">' + (t.repeat ? esc(REPEATS[t.repeat]) : t.date ? fmtDate(t.date) : 'Anytime') + '</span></li>';
  openModal(sheet('All tasks', '<p class="eyebrow">Open · ' + open.length + '</p><ul class="tasks">' + open.map(row).join('') + '</ul><div class="divider"></div><p class="eyebrow">Habits · ' + habits.length + '</p><ul class="tasks">' + habits.map(row).join('') + '</ul>' + (done.length ? '<div class="divider"></div><p class="eyebrow">Recently done</p><ul class="tasks">' + done.map(row).join('') + '</ul>' : '') +
    '<div class="divider"></div><form class="inline-form" data-form="addTaskFull"><input type="text" id="at_t" placeholder="New task" autocomplete="off"><select id="at_a">' + Object.keys(AREAS).map(a => '<option value="' + a + '">' + AREAS[a] + '</option>').join('') + '</select><input type="date" id="at_d" value="' + dkey() + '" style="flex:0 1 160px"><select id="at_r">' + Object.keys(REPEATS).map(r => '<option value="' + r + '">' + REPEATS[r] + '</option>').join('') + '</select><button class="btn btn-primary" type="submit">Add</button></form>'));
}
function oppModal(o) {
  const n = !o; o = o || {id:'', name:'', track:'Other', stage:'Idea', priority:3, summary:'', nextAction:'', risks:'', facts:'', assumptions:'', links:'', notes:''};
  openModal(sheet(n ? 'New opportunity' : 'Edit opportunity', '<form class="stack" data-form="saveOpp" data-id="' + o.id + '"><label class="f">Name<input type="text" id="op_name" value="' + esc(o.name) + '" required></label><div class="fields"><label class="f">Track<input type="text" id="op_track" value="' + esc(o.track) + '" placeholder="Docstar, Asset, Family…"></label><label class="f">Stage<select id="op_stage">' + STAGES.map(s => '<option ' + (s === o.stage ? 'selected' : '') + '>' + s + '</option>').join('') + '</select></label><label class="f">Priority (1 = top)<input type="number" id="op_prio" min="1" max="5" value="' + o.priority + '"></label></div>' +
    '<label class="f">Summary<textarea id="op_sum" rows="2">' + esc(o.summary) + '</textarea></label><label class="f">Next action<input type="text" id="op_next" value="' + esc(o.nextAction) + '"></label>' +
    '<div class="factbox"><label class="f"><span><span class="tag tag-verified">Verified</span> facts you’ve confirmed</span><textarea id="op_facts" placeholder="Only things you checked: a quote, a rule, a signed agreement.">' + esc(o.facts) + '</textarea></label><label class="f"><span><span class="tag tag-assumption">Assumption</span> still unproven</span><textarea id="op_ass">' + esc(o.assumptions) + '</textarea></label></div>' +
    '<label class="f">Risks / what can break it<textarea id="op_risk" rows="2">' + esc(o.risks) + '</textarea></label><label class="f">Links (one per line)<textarea id="op_links" rows="2">' + esc(o.links) + '</textarea></label><label class="f">Notes<textarea id="op_notes" rows="2">' + esc(o.notes) + '</textarea></label>' +
    '<div class="row-between">' + (n ? '<span></span>' : '<div class="row"><button class="btn btn-ghost btn-danger" type="button" data-act="rmOpp" data-id="' + o.id + '">Delete</button>' + (AI.state === 'on' ? '<button class="btn btn-ghost" type="button" data-act="oppMentor" data-id="' + o.id + '">Challenge it</button>' : '') + '</div>') + '<button class="btn btn-primary" type="submit">Save</button></div></form>'));
}
function settingsModal() {
  const g = S.profile.goals, T = S.body.targets;
  openModal(sheet('Settings', '<form class="stack" data-form="saveSettings"><p class="eyebrow">Goals</p><div class="fields"><label class="f">Goal weight (lb)<input type="number" id="st_wg" value="' + num(g.weightGoal) + '"></label><label class="f">Monthly income goal ($)<input type="number" id="st_ig" value="' + num(g.incomeGoalMonthly) + '"></label><label class="f">Gym start time<input type="time" id="st_gt" value="' + esc(g.gymTime) + '"></label><label class="f">Sleep target (h)<input type="number" id="st_sl" step="0.25" value="' + num(g.sleepTarget) + '"></label></div>' +
    '<p class="eyebrow">Daily food targets</p><div class="fields"><label class="f">Calories<input type="number" id="st_kc" value="' + num(T.kcal) + '"></label><label class="f">Protein (g)<input type="number" id="st_pr" value="' + num(T.protein) + '"></label><label class="f">Water (oz)<input type="number" id="st_wa" value="' + num(T.water) + '"></label></div>' +
    '<div class="row"><button class="btn btn-primary" type="submit">Save settings</button><button class="btn" type="button" data-act="rebuildSchedule">Rebuild schedule from gym time</button></div></form>' +
    '<div class="divider"></div><p class="eyebrow" style="margin-bottom:8px">Your data</p><p class="small muted">' + (Store.mode === 'cloud' ? 'Saved privately to your account. Only you can read it; your crew only sees the daily check-in you share. It syncs between your iPhone, Mac, and PC.' : 'Saving on this device only. Sign in to sync privately.') + '</p>' +
    '<div class="row" style="margin-top:10px"><button class="btn" data-act="export" data-f="md">Export summary (.md)</button><button class="btn" data-act="export" data-f="json">Export everything (.json)</button><button class="btn" data-act="openRestore">Restore from backup</button>' + (window.CC_HOST && window.CC_HOST.signOut ? '<button class="btn btn-ghost btn-danger" data-act="signOut">Sign out</button>' : '') + '</div>' +
    '<div class="divider"></div><p class="small faint">AI: ' + (AI.state === 'on' ? 'on' + (AI.tools ? ', with plan-change proposals' : '') + '. AI requests are billed to your Anthropic API key.' : 'off (no AI key set).') + '</p>'));
}
function scheduleModal(date) {
  UI.schedDate = date || null;
  const bl = (date ? blocksFor(date) : S.profile.schedule).slice().sort((a, b) => toMin(a.start) - toMin(b.start));
  openModal(sheet(date ? 'Schedule for ' + fmtDate(date) + ' only' : 'Usual schedule', '<p class="small muted" style="margin-bottom:10px">' + (date ? 'Changes here apply to this day only. Your usual week stays the same.' + (S.profile.overrides[date] ? ' <button class="btn btn-ghost btn-sm" data-act="resetDay" data-d="' + date + '">Back to normal</button>' : '') : 'Set your real class and work times. The Today screen tells you what to do in each block.') + '</p><div class="stack" style="gap:8px">' + bl.map(b => '<div class="row" style="gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px"><input type="time" id="sb_s_' + b.id + '" data-ch="blk" data-id="' + b.id + '" data-f="start" value="' + b.start + '" style="width:118px"><input type="time" id="sb_e_' + b.id + '" data-ch="blk" data-id="' + b.id + '" data-f="end" value="' + b.end + '" style="width:118px"><input type="text" id="sb_l_' + b.id + '" data-ch="blk" data-id="' + b.id + '" data-f="label" value="' + esc(b.label) + '" style="flex:1 1 180px;width:auto"><select id="sb_d_' + b.id + '" data-ch="blk" data-id="' + b.id + '" data-f="days" style="width:auto">' + Object.keys(DAYS_OPTS).map(d => '<option value="' + d + '" ' + (d === b.days ? 'selected' : '') + '>' + DAYS_OPTS[d] + '</option>').join('') + '</select><button class="btn btn-ghost btn-sm" data-act="rmBlk" data-id="' + b.id + '">Remove</button></div>').join('') + '</div><div class="row" style="margin-top:12px"><button class="btn" data-act="addBlk">+ Add block</button><button class="btn btn-primary" data-act="closeModal">Done</button></div>'));
}

/* ================= actions ================= */
const ACT = {
  closeModal:() => closeModal(),
  openSettings:() => { if (S.profile) settingsModal(); },
  editSchedule:() => scheduleModal(null),
  editToday:() => scheduleModal(dkey()),
  resetDay:el => { const d = el.dataset.d; delete S.profile.overrides[d]; delete S.profile.workoutOverride[d]; logDecision('Reset ' + fmtDate(d) + ' to the usual schedule', [], 'approved', 'You'); touch('profile'); if (!$('#modal').hidden) closeModal(); toast('Back to your usual schedule'); },
  seg:el => { UI[el.dataset.key] = el.dataset.v; saveUI(); render(); },
  goWorkout:() => { UI.train = 'workout'; saveUI(); },
  goOpps:() => { UI.moneyTab = 'opps'; saveUI(); },
  goTalks:() => { UI.mentorTab = 'talks'; saveUI(); },
  toggleTask:el => {
    const t = S.tasks.items.find(x => x.id === el.dataset.id); if (!t) return; const k = el.dataset.k || dkey();
    if (t.repeat) { t.doneOn = t.doneOn || {}; if (t.doneOn[k]) delete t.doneOn[k]; else t.doneOn[k] = true; const cut = addDays(dkey(), -60); Object.keys(t.doneOn).forEach(d => { if (d < cut) delete t.doneOn[d]; }); }
    else { t.done = !t.done; t.doneAt = t.done ? k : null; }
    touch('tasks'); if (!$('#modal').hidden && $('#modalTitle') && $('#modalTitle').textContent === 'All tasks') allTasksModal();
  },
  editTask:el => { const t = S.tasks.items.find(x => x.id === el.dataset.id); if (t) taskModal(t); },
  rmTask:el => { if (!armed(el, 'Tap again to delete')) return; S.tasks.items = S.tasks.items.filter(x => x.id !== el.dataset.id); touch('tasks'); closeModal(); toast('Task deleted'); },
  allTasks:() => allTasksModal(),
  guidance:() => aiGuidance(),
  approve:el => { const p = S.mentor.proposals.find(x => x.id === el.dataset.id); if (!p) return; p.changes.filter(validChange).forEach(applyChange); p.status = 'approved'; logDecision(p.summary, p.items, 'approved', p.source); touch('mentor'); toast('Approved and applied'); },
  reject:el => { const p = S.mentor.proposals.find(x => x.id === el.dataset.id); if (!p) return; p.status = 'rejected'; logDecision(p.summary, p.items, 'rejected', p.source); touch('mentor'); toast('Rejected. Nothing changed.'); },
  startWorkout:el => {
    const day = S.train.plan.days.find(d => d.id === el.dataset.id); if (!day) return; const h = lastNightSleep();
    if (h != null && h < 6 && !armed(el, 'Under 6 h sleep. Tap again to train anyway')) return;
    const sets = {}; day.exercises.forEach(ex => { const sg = suggestFor(ex, h); sets[ex.id] = Array.from({length:sg.sets}, () => ({w:sg.w != null ? sg.w : (ex.inc ? '' : 0), r:''})); });
    S.train.draft = {dayId:day.id, date:dkey(), startedAt:Date.now(), sets}; touch('train');
  },
  addSet:el => { const a = S.train.draft.sets[el.dataset.ex] = S.train.draft.sets[el.dataset.ex] || []; const last = a[a.length - 1]; a.push({w:last ? last.w : '', r:''}); touch('train'); },
  rmSet:el => { const a = S.train.draft.sets[el.dataset.ex]; if (a) { a.splice(+el.dataset.i, 1); touch('train'); } },
  finishWorkout:() => {
    const d = S.train.draft; if (!d) return; const day = S.train.plan.days.find(x => x.id === d.dayId);
    const sets = {}; let n = 0; Object.keys(d.sets).forEach(id => { const a = d.sets[id].filter(s => num(s.r) > 0).map(s => ({w:num(s.w), r:num(s.r)})); if (a.length) { sets[id] = a; n += a.length; } });
    if (!n) { toast('Enter reps for at least one set first.'); return; }
    S.train.sessions.push({id:uid(), date:d.date, dayId:d.dayId, dayName:day ? day.name : 'Workout', sets, minutes:Math.round((Date.now() - d.startedAt) / 60000)});
    if (S.train.sessions.length > 400) S.train.sessions.splice(0, S.train.sessions.length - 400);
    S.train.draft = null; touch('train'); toast('Workout saved: ' + n + ' sets');
  },
  discardWorkout:el => { if (!armed(el, 'Tap again to discard')) return; S.train.draft = null; touch('train'); },
  rmWeight:el => { S.body.weights = S.body.weights.filter(w => w.date !== el.dataset.d); touch('body'); },
  water:el => { const k = el.dataset.k; const f = S.body.food[k] = S.body.food[k] || {meals:[], water:0}; f.water = Math.max(0, num(f.water) + num(el.dataset.d)); touch('body'); },
  rmMeal:el => { const f = S.body.food[el.dataset.k]; if (f) { f.meals = f.meals.filter(m => m.id !== el.dataset.id); touch('body'); } },
  copyMeals:el => { const k = el.dataset.k, y = S.body.food[addDays(k, -1)]; if (!y || !y.meals.length) { toast('No meals logged yesterday.'); return; } const f = S.body.food[k] = S.body.food[k] || {meals:[], water:0}; y.meals.forEach(m => f.meals.push(Object.assign({}, m, {id:uid()}))); touch('body'); toast('Copied ' + y.meals.length + ' meals'); },
  rmSleep:el => { delete S.body.sleep[el.dataset.d]; touch('body'); },
  addDay:() => { const used = gymDows(); const dow = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].find(d => !used.includes(d)) || 'Sat'; S.train.plan.days.push({id:uid(), dow, name:'New workout', exercises:[]}); touch('train'); },
  rmDay:el => { if (!armed(el, 'Tap again to remove')) return; S.train.plan.days = S.train.plan.days.filter(d => d.id !== el.dataset.id); touch('train'); },
  addEx:el => { const d = S.train.plan.days.find(x => x.id === el.dataset.id); d.exercises.push({id:uid(), name:'New exercise', sets:3, repMin:8, repMax:12, inc:5}); touch('train'); },
  rmEx:el => { const d = S.train.plan.days.find(x => x.id === el.dataset.day); d.exercises = d.exercises.filter(e => e.id !== el.dataset.id); touch('train'); },
  coachPlan:() => startThreadWith('fitness', 'Look at my training plan, equipment, recent sessions, weight trend, and food. Tell me exactly what to change this week to keep gaining 0.25–0.5 lb/week and progressing on my lifts.'),
  funnel:el => { const k = el.dataset.k, d = num(el.dataset.d); const f = S.money.funnel; const nv = Math.max(0, num(f[k]) + d); if (nv === num(f[k])) return; S.money.funnelLog.push({date:dkey(), k, d:nv - num(f[k])}); f[k] = nv; if (S.money.funnelLog.length > 600) S.money.funnelLog.splice(0, 100); touch('money'); },
  oppFilter:el => { UI.oppFilter = el.dataset.v; saveUI(); render(); },
  editOpp:el => oppModal(el.dataset.id ? opp(el.dataset.id) : null),
  rmOpp:el => { if (!armed(el, 'Tap again to delete')) return; const o = opp(el.dataset.id); S.money.opps = S.money.opps.filter(x => x.id !== el.dataset.id); if (o) logDecision('Deleted opportunity “' + o.name + '”', [], 'approved', 'You'); touch('money'); closeModal(); },
  oppMentor:el => { const o = opp(el.dataset.id); closeModal(); startThreadWith('challenge', 'Pressure-test this opportunity: “' + o.name + '” (id ' + o.id + '). What are the weakest assumptions, what would my dad push back on, and what are the next 3 things I must verify before spending money?'); },
  rmLedger:el => { if (!armed(el, 'Tap again')) return; S.money.ledger = S.money.ledger.filter(e => e.id !== el.dataset.id); touch('money'); },
  dealReset:() => { delete S.deals.working[UI.dealType]; touch('deals'); },
  loadDeal:el => { const a = S.deals.analyses.find(x => x.id === el.dataset.id); if (!a) return; S.deals.working[a.type] = Object.assign({}, a.inputs, {_edited:true}); UI.dealType = a.type; saveUI(); touch('deals'); toast('Loaded “' + a.name + '”'); },
  rmDeal:el => { if (!armed(el, 'Tap again')) return; S.deals.analyses = S.deals.analyses.filter(x => x.id !== el.dataset.id); touch('deals'); },
  dealMentor:() => {
    const type = UI.dealType, v = dealVals(type), R = compute(type, v);
    const lines = R.rows.map(r => r[0] + ': ' + [1, 2, 3].map(i => r[4] === '$' ? money(r[i]) : r[i]).join(' / ')).join('\n');
    startThreadWith('challenge', 'Tear apart this ' + CALC[type].label.toLowerCase() + ' analysis (' + (isExample(type) ? 'example numbers from my blueprint' : 'my own unverified numbers') + '). Columns are ' + R.cols.join(' / ') + '.\nInputs: ' + JSON.stringify(v) + '\n' + lines + '\nMetrics: ' + R.metrics.map(m => m[0] + ' ' + m[1]).join('; ') + '\nWhich inputs are most likely wrong, what would my dad say, and what would it take to pass?');
  },
  newThread:() => { UI.threadId = null; saveUI(); render(); setTimeout(() => { const c = $('#chatInput'); if (c) c.focus(); }, 30); },
  openThread:el => { UI.threadId = el.dataset.id; UI.scrollChat = true; saveUI(); render(); },
  rmThread:el => { if (!armed(el, 'Tap again to delete')) return; S.mentor.threads = S.mentor.threads.filter(t => t.id !== el.dataset.id); UI.threadId = null; saveUI(); touch('mentor'); },
  pickMode:el => { UI.newMode = el.dataset.v; saveUI(); render(); },
  starter:el => { const c = $('#chatInput'); if (c) { c.value = el.dataset.q; c.focus(); } if (/move|add a task|rejected|back burner/i.test(el.dataset.q)) { UI.newMode = 'plan'; saveUI(); render(); const c2 = $('#chatInput'); if (c2) c2.value = el.dataset.q; } },
  stopChat:() => { if (UI.streaming && UI.streaming.ctl) UI.streaming.ctl.abort(); },
  saveNote:el => { const th = currentThread(); const m = th && th.messages[+el.dataset.i]; if (!m) return; S.mentor.notes.push({id:uid(), date:dkey(), kind:'note', text:m.content, threadId:th.id}); touch('mentor'); el.textContent = 'Saved'; el.disabled = true; toast('Saved to Notes'); },
  chatChecklist:() => chatToChanges('checklist'),
  chatPropose:() => chatToChanges('propose'),
  mentorWith:el => startThreadWith(el.dataset.mode, el.dataset.q),
  talkDone:el => { const s = S.mentor.sessions.find(x => x.id === el.dataset.id); s.done = !s.done; touch('mentor'); },
  rmTalk:el => { if (!armed(el, 'Tap again')) return; S.mentor.sessions = S.mentor.sessions.filter(x => x.id !== el.dataset.id); touch('mentor'); },
  talkPrep:el => { const s = S.mentor.sessions.find(x => x.id === el.dataset.id); startThreadWith('prep', 'Prep me for my talk with my dad on ' + fmtDate(s.date) + ' about: ' + s.topic + (s.questions.length ? '\nQuestions I plan to ask: ' + s.questions.join(' | ') : '')); },
  talkDebrief:el => { const s = S.mentor.sessions.find(x => x.id === el.dataset.id); UI.mentorTab = 'chat'; UI.newMode = 'debrief'; UI.threadId = null; UI.pendingDraft = 'Debrief my talk with Dad about “' + s.topic + '”. Here’s what each of us said:\n- Me: \n- Dad: \nWhat did we decide?'; saveUI(); render(); setTimeout(() => { const c = $('#chatInput'); if (c) { c.value = UI.pendingDraft; c.focus(); } }, 30); },
  talkQuestions:el => talkQuestions(el.dataset.id),
  rmNote:el => { if (!armed(el, 'Tap again')) return; S.mentor.notes = S.mentor.notes.filter(n => n.id !== el.dataset.id); touch('mentor'); },
  openLesson:el => { UI.learnId = el.dataset.id; UI.quiz = null; if (UI.tab !== 'learn') location.hash = '#learn'; render(); window.scrollTo(0, 0); },
  closeLesson:() => { UI.learnId = null; UI.quiz = null; render(); },
  markRead:el => { const p = S.learn.progress[el.dataset.id] = S.learn.progress[el.dataset.id] || {}; p.read = true; p.readAt = dkey(); touch('learn'); },
  quizStatic:el => { const L = LESSONS.find(l => l.id === el.dataset.id); UI.quiz = {id:L.id, questions:L.quiz, ans:{}, submitted:false, ai:false}; render(); },
  quizAI:el => aiQuiz(el.dataset.id),
  quizPick:el => { UI.quiz.ans[+el.dataset.q] = +el.dataset.o; render(); },
  quizSubmit:() => { const q = UI.quiz; q.submitted = true; q.score = q.questions.filter((x, i) => q.ans[i] === x.a).length; const p = S.learn.progress[q.id] = S.learn.progress[q.id] || {}; p.quizzes = p.quizzes || []; p.quizzes.push({date:dkey(), score:q.score, total:q.questions.length, ai:q.ai}); p.read = true; p.readAt = p.readAt || dkey(); touch('learn'); },
  quizClose:() => { UI.quiz = null; render(); },
  rebuildSchedule:el => { if (!armed(el, 'Replaces your blocks. Tap again')) return; S.profile.schedule = defaultSchedule(S.profile.goals.gymTime, S.profile.goals.sleepTarget); touch('profile'); toast('Schedule rebuilt'); },
  addBlk:() => { const d = UI.schedDate; schedTarget(d).push({id:uid(), start:'12:00', end:'13:00', label:'New block', area:'life', days:d ? 'all' : 'weekdays'}); touch('profile'); scheduleModal(d); },
  rmBlk:el => { const d = UI.schedDate, t = schedTarget(d).filter(b => b.id !== el.dataset.id); if (d) S.profile.overrides[d] = t; else S.profile.schedule = t; touch('profile'); scheduleModal(d); },
  export:el => doExport(el.dataset.f)
};

  woDay:el => { UI.workoutDay = el.value; render(); },
  setVal:el => { const a = S.train.draft && S.train.draft.sets[el.dataset.ex]; if (!a || !a[+el.dataset.i]) return; a[+el.dataset.i][el.dataset.f] = el.value === '' ? '' : num(el.value); touch('train'); },
  foodDate:el => { UI.foodDate = el.value || dkey(); render(); },
  equip:el => { S.train.equipment = el.value; touch('train'); },
  dayDow:el => { const d = S.train.plan.days.find(x => x.id === el.dataset.id); d.dow = el.value; touch('train'); },

/* ================= AI flows ================= */
function newThread(mode, firstMsg) {
  const th = {id:uid(), title:firstMsg.replace(/\s+/g, ' ').slice(0, 60) + (firstMsg.length > 60 ? '…' : ''), mode:mode || 'explain', createdAt:Date.now(), updatedAt:Date.now(), messages:[]};
  S.mentor.threads.push(th); if (S.mentor.threads.length > 60) S.mentor.threads.shift();
  UI.threadId = th.id; saveUI(); return th;
}
function startThreadWith(mode, q) {
  if (AI.state !== 'on') { toast('AI is off in this version.'); return; }
  UI.mentorTab = 'chat'; UI.threadId = null; UI.newMode = mode; saveUI();
  if (location.hash !== '#mentor') location.hash = '#mentor';
  sendChat(q, mode);
}
async function sendChat(text, modeOverride) {
  if (!AI.sample) { toast('AI is off in this version.'); return; }
  let th = currentThread(); if (!th) th = newThread(modeOverride || UI.newMode, text);
  th.messages.push({role:'user', content:text, at:Date.now()}); th.updatedAt = Date.now();
  if (th.messages.length > 80) th.messages.splice(0, th.messages.length - 80);
  touch('mentor');
  const ctl = new AbortController();
  UI.streaming = {threadId:th.id, text:'', ctl}; UI.scrollChat = true; render();
  const turns = th.messages.slice(-24).map(m => ({role:m.role, content:String(m.content || '(empty)')}));
  const input = [{role:'user', content:rulesFor(th.mode)}].concat(turns);
  const opts = {signal:ctl.signal, cache:false, onText:({text}) => { if (UI.streaming) UI.streaming.text = text; const el = $('#streamBubble'); if (el) el.innerHTML = md(text); }};
  if (AI.tools) opts.tools = [proposeTool(th.id)];
  try {
    const r = await AI.sample(input, opts);
    th.messages.push({role:'assistant', content:r.text + (r.truncated ? '\n\n(Cut short. Ask me to continue.)' : ''), at:Date.now()});
  } catch (e) {
    if (e && e.text) th.messages.push({role:'assistant', content:e.text + '\n\n(Interrupted)', at:Date.now()});
    if (!e || e.code !== 'cancelled') toast(aiErr(e));
    if (e && e.code === 'tools_unavailable') AI.tools = false;
    aiOffHard(e);
  } finally { th.updatedAt = Date.now(); UI.streaming = null; UI.scrollChat = true; touch('mentor'); }
}
async function chatToChanges(kind) {
  const th = currentThread(); if (!th || !AI.sample || UI.busy.chatJson) return;
  const convo = th.messages.slice(-16).map(m => (m.role === 'user' ? 'Ethan: ' : 'Mentor: ') + String(m.content).slice(0, 3000)).join('\n\n');
  UI.busy.chatJson = kind === 'checklist' ? 'Pulling action items…' : 'Drafting plan changes…'; render();
  try {
    let input;
    if (kind === 'checklist') input = 'Extract the concrete action items Ethan should do from this conversation. Today is ' + dkey() + '. Reply with only a JSON array of objects {"title": string (imperative, under 90 chars), "area": "docstar"|"research"|"body"|"school"|"learn"|"life", "date": "YYYY-MM-DD" or null}. Max 8 items. Return [] if there are none.\n\nConversation:\n' + convo;
    else input = 'From this conversation, decide what changes Ethan asked for or agreed to in his plan. ' + CHANGE_FORMAT + '\n\nApp data:\n' + appContext() + '\n\nConversation:\n' + convo;
    const res = await AI.sample.json(input, {modelTier:'quick'});
    let p = null;
    if (kind === 'checklist') { const arr = Array.isArray(res) ? res : []; p = queueProposal({summary:'Action items from “' + th.title + '”', changes:arr.map(x => ({type:'add_task', title:x && x.title, area:x && x.area, date:x && x.date}))}, 'Checklist from chat', th.id); }
    else p = queueProposal(res || {}, 'Mentor chat', th.id);
    toast(p ? 'Review the proposal above, then approve or reject.' : 'No changes found in this conversation.');
    if (p) window.scrollTo({top:0, behavior:'smooth'});
  } catch (e) { toast(aiErr(e)); aiOffHard(e); }
  finally { UI.busy.chatJson = null; render(); }
}
async function talkQuestions(id) {
  const s = S.mentor.sessions.find(x => x.id === id); if (!s || !AI.sample) return;
  UI.busy['q' + id] = true; render();
  try {
    const res = await AI.sample.json('Ethan has a business conversation with his father Christopher (owner of Docstar Services, experienced business owner) about: "' + s.topic + '". Write 6 sharp, specific questions Ethan should ask him, ordered from most to least important. Mix: clarifying his expectations, testing the numbers, and learning from his experience. Reply with only a JSON array of strings.\n\nApp data:\n' + appContext(), {modelTier:'quick'});
