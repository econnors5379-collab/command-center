}
async function aiQuiz(id) {
  const L = LESSONS.find(l => l.id === id); if (!L || !AI.sample) return;
  UI.busy.quiz = true; render();
  try {
    const res = await AI.sample.json('Write a 4-question multiple-choice quiz on "' + L.title + '" for a 20-year-old learning to evaluate deals (Docstar commissions, short-term rentals, performance-car rentals, family land). Use realistic but clearly hypothetical numbers and require a little calculation on at least 2 questions. Lesson:\n' + L.body.join('\n') + '\nFormula: ' + L.formula + '\n\nReply with only a JSON array of 4 objects {"q": string, "o": [4 strings], "a": index 0-3 of the correct option, "why": one-sentence explanation}.', {modelTier:'quick', cache:false});
    const qs = (Array.isArray(res) ? res : []).filter(x => x && x.q && Array.isArray(x.o) && x.o.length >= 2 && num(x.a) >= 0 && num(x.a) < x.o.length).map(x => ({q:String(x.q), o:x.o.map(String), a:num(x.a), why:String(x.why || '')}));

  } catch (e) { toast(aiErr(e)); aiOffHard(e); }
  finally { UI.busy.quiz = false; render(); }

    '<div class="kpis" style="margin-top:12px"><div class="kpi"><div class="v ' + (s.probLoss > 0.5 ? 'neg' : s.probLoss > 0.2 ? '' : 'pos') + '">' + Math.round(s.probLoss * 100) + '%</div><div class="l">Chance still down at the end</div></div><div class="kpi"><div class="v ' + sc(s.f50) + '">' + money(s.f50) + '</div><div class="l">Typical result</div></div><div class="kpi"><div class="v ' + sc(s.f10) + '">' + money(s.f10) + '</div><div class="l">Bad case (1 in 10)</div></div><div class="kpi"><div class="v ' + sc(s.f90) + '">' + money(s.f90) + '</div><div class="l">Good case (1 in 10)</div></div><div class="kpi"><div class="v">' + (s.be ? 'Month ' + s.be : 'Never') + '</div><div class="l">Typical payback</div></div></div>' +
    '<div class="row" style="margin-top:12px"><button class="btn btn-sm" data-act="runSim">↻ Run again</button>' + (AI.state === 'on' ? '<button class="btn btn-ghost btn-sm" data-act="simMentor">' + ICON.spark + 'What does this mean?</button>' : '') + '</div>';
}
function drawSim() {
  const el = $('#simChart'), s = UI.sim; if (!el || !s) return;
  const step = Math.max(1, Math.min(s.M, s.step || s.M));
  el.innerHTML = chartSVG({type:'line', points:s.rep.slice(0, step).map(y => ({y})), n:s.M, band:s.p10.map((lo, i) => ({lo, hi:s.p90[i]})), ref:[{y:0, label:'Break-even'}], labels:Array.from({length:s.M}, (_, i) => 'Mo ' + (i + 1)), unit:'$', h:230, id:'sim', live:step < s.M, color:s.rep[step - 1] >= 0 ? 'var(--good)' : 'var(--crit)', title:'Simulated cumulative cash'});
  const v = s.rep[step - 1], t = $('#simTick'); if (t) { t.textContent = (v > 0 ? '+' : '') + money(v); t.className = 'mono ' + (v >= 0 ? 'pos' : 'neg'); }
  const m = $('#simMonth'); if (m) m.textContent = 'Month ' + step + ' / ' + s.M;
}
function animateSim() {
  clearInterval(UI.simTimer); const s = UI.sim; if (!s) return;
  let reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  s.step = reduce ? s.M : 1; drawSim(); if (reduce) return;
  UI.simTimer = setInterval(() => { if (!UI.sim) { clearInterval(UI.simTimer); return; } UI.sim.step++; drawSim(); if (UI.sim.step >= UI.sim.M) clearInterval(UI.simTimer); }, 110);
}
Object.assign(ACT, {
  pnlRange:el => { UI.pnlRange = el.dataset.v; render(); },
  chartMode:el => { UI[el.dataset.key] = el.dataset.v; render(); },
  runSim:() => { const t = UI.dealType, v = dealVals(t), seed = (Math.random() * 1e9) | 0; UI.sim = Object.assign(simulate(t, v, seed), {type:t, key:JSON.stringify(v), seed}); render(); animateSim(); },
  simMentor:() => { const s = UI.sim; if (!s) return; startThreadWith('challenge', 'I ran a 400-run simulation on my ' + CALC[s.type].label.toLowerCase() + ' analysis (' + (isExample(s.type) ? 'example inputs' : 'my own unverified inputs') + ') over ' + s.M + ' months, starting from minus my upfront cash. Results: ' + Math.round(s.probLoss * 100) + '% chance I am still down at the end; typical result ' + money(s.f50) + '; bad case (1 in 10) ' + money(s.f10) + '; good case ' + money(s.f90) + '; typical payback ' + (s.be ? 'month ' + s.be : 'never') + '. Inputs: ' + JSON.stringify(dealVals(s.type)) + '. What does this actually tell me, which inputs drive the risk most, and would you take this deal?'); }
});

/* ================= crew ================= */
const CREW = {api:null, me:null, profile:null, crews:[], crew:null, members:[], statuses:[], hist:[], nudges:[], unsub:[], last:'', timer:null, ready:false, watchDate:null};
const KIND = {gym:'gym', docstar:'work', research:'work', school:'school', learn:'school', body:'other', life:'free'};
const NUDGES = {gym:'Gym in 10. Let’s go.', locked_in:'Locked in.', check:'You good? Check in.'};
function initCrew() {
  const C = window.claude; if (!C || typeof C.use !== 'function') return;
  C.use('crew').then(async api => {
    if (!api) return; CREW.api = api;
    if (!TABS.some(t => t[0] === 'crew')) TABS.push(['crew','Crew']);
    try { CREW.me = await api.me(); CREW.profile = await api.getProfile(); await loadCrews(); } catch (e) { console.warn('crew', e); }
    CREW.ready = true; if (location.hash === '#crew') route(); else scheduleRender();
    const recheck = async () => { if (CREW.crew) return; try { if (!CREW.profile || !CREW.profile.display_name) CREW.profile = await api.getProfile(); await loadCrews(); } catch (e) {} scheduleRender(); };
    window.addEventListener('hashchange', () => { if (location.hash === '#crew') recheck(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { recheck(); if (CREW.crew) loadHistory(); } });
  }).catch(() => {});
}
async function loadCrews() { CREW.crews = await CREW.api.myCrews(); CREW.crew = CREW.crews[0] || null; if (CREW.crew) await startCrewWatch(); }
async function startCrewWatch() {
  CREW.unsub.forEach(f => { try { f(); } catch (e) {} }); CREW.unsub = [];
  const c = CREW.crew; CREW.watchDate = dkey();
  try { CREW.members = await CREW.api.members(c.id); } catch (e) { CREW.members = []; }
  CREW.unsub.push(CREW.api.watchStatus(c.id, CREW.watchDate, rows => { CREW.statuses = rows || []; CREW.api.members(c.id).then(m => { CREW.members = m; scheduleRender(); }).catch(() => {}); scheduleRender(); }));
  CREW.unsub.push(CREW.api.watchNudges(c.id, (list, fresh) => { CREW.nudges = list || []; if (fresh && CREW.me && fresh.to_user === CREW.me.id) toast(memberName(fresh.from_user) + ': ' + nudgeText(fresh)); scheduleRender(); }));
  loadHistory(); schedulePublish(true);
}
async function loadHistory() { if (!CREW.crew) return; try { CREW.hist = await CREW.api.history(CREW.crew.id, addDays(dkey(), -6)); scheduleRender(); } catch (e) {} }
function memberName(id) { if (CREW.me && id === CREW.me.id) return 'You'; const m = CREW.members.find(x => x.id === id); return (m && m.display_name) || 'Crewmate'; }
function nudgeText(n) { return n.message || NUDGES[n.kind] || 'Nudge'; }
function crewStreak() { const C = (S.profile && S.profile.checkins) || {}; let d = dkey(), n = 0; if (!(C[d] && C[d].plan_followed)) d = addDays(d, -1); while (C[d] && C[d].plan_followed && n < 400) { n++; d = addDays(d, -1); } return n; }
function myStatus() {
  const k = dkey(), pd = planDayFor(k), f = S.money.funnel, share = !!S.profile.crewShareMoney, ws = weekStart(k), wk = {};
  S.money.funnelLog.forEach(l => { if (l.date >= ws) wk[l.k] = (wk[l.k] || 0) + num(l.d); });
  const stats = {streak_days:crewStreak(), workouts_week:S.train.sessions.filter(s => s.date >= ws).length, share_money:share, docstar_sent:num(f.sent), docstar_replies:num(f.replies), docstar_customers:num(f.customers), docstar_sent_week:num(wk.sent)};
  if (share) stats.mtd_net = Math.round(monthTotals(k.slice(0, 7)).net);
  return {schedule:blocksFor(k).map(b => ({start:b.start, end:b.end, label:b.label.replace('today’s workout', pd ? pd.name : 'workout'), kind:KIND[b.area] || 'other'})), checkin:(S.profile.checkins || {})[k] || {}, stats};
}
function schedulePublish(now) {
  if (!CREW.api || !CREW.crew || !S.profile || !S.money) return;
  clearTimeout(CREW.timer);
  CREW.timer = setTimeout(async () => { try { const st = myStatus(), j = dkey() + JSON.stringify(st); if (j === CREW.last) return; await CREW.api.publish(CREW.crew.id, dkey(), st); CREW.last = j; } catch (e) { console.warn('crew publish failed', e); } }, now ? 300 : 3500);
}
function crewMiniHTML() {
  if (!CREW.api || !CREW.crew || !CREW.me) return '';
  const others = CREW.members.filter(m => m.id !== CREW.me.id);
  return '<div class="card"><div class="card-head"><div><p class="eyebrow">Crew · ' + esc(CREW.crew.name) + '</p><h2>Accountability</h2></div><a class="btn btn-ghost btn-sm" href="#crew">Open</a></div>' +
    (others.length ? others.map(m => { const st = CREW.statuses.find(s => s.user_id === m.id), c = (st && st.checkin) || {}; return '<div class="row-between"><b class="small">' + esc(m.display_name || 'Crewmate') + '</b><span class="small muted">' + (st ? (c.plan_followed === true ? '<span class="pos">On plan</span>' : c.plan_followed === false ? '<span class="neg">Off plan</span>' : 'No check-in yet') + ' · streak ' + num(st.stats && st.stats.streak_days) : 'No check-in yet') + '</span></div>'; }).join('') : '<p class="small muted">Waiting for your friend to join with code <b class="mono">' + esc(CREW.crew.invite_code || '') + '</b>.</p>') + '</div>';
}
function viewCrew() {
  const head = '<section class="page-head"><div><p class="eyebrow">Crew · accountability</p><h1>' + (CREW.crew ? esc(CREW.crew.name) : 'Crew') + '</h1></div>' + (CREW.crew && CREW.crew.invite_code ? '<button class="btn btn-sm" data-act="copyCode">Invite code <span class="mono">' + esc(CREW.crew.invite_code) + '</span></button>' : '') + '</section>';
  if (!CREW.api) return head + '<div class="empty">Crew works in the standalone app.</div>';
  if (!CREW.ready) return head + '<div class="thinking"><i></i><i></i><i></i> Loading crew…</div>';
  if (!CREW.profile || !CREW.profile.display_name) return head + '<form class="card stack" data-form="crewName" style="max-width:520px"><h2>Your name in the crew</h2><p class="small muted">This is what your friend sees.</p><input type="text" id="cw_name" placeholder="Ethan" autocomplete="off" maxlength="40"><div class="row"><button class="btn btn-primary" type="submit">Save</button></div></form>';
  if (!CREW.crew) return head + '<div class="grid-2"><form class="card stack" data-form="crewCreate"><h2>Start a crew</h2><p class="small muted">You get a 6-character code to give your friend.</p><input type="text" id="cw_cname" value="Locked In" autocomplete="off" maxlength="40"><div class="row"><button class="btn btn-primary" type="submit">Create crew</button></div></form><form class="card stack" data-form="crewJoin"><h2>Join with a code</h2><p class="small muted">If your friend already made one.</p><input type="text" id="cw_code" placeholder="ABC123" autocomplete="off" maxlength="12" style="text-transform:uppercase"><div class="row"><button class="btn" type="submit">Join</button></div></form></div>';
  const k = dkey(), meId = CREW.me.id, myC = (S.profile.checkins || {})[k] || {};
  const members = CREW.members.length ? CREW.members.slice() : [{id:meId, display_name:CREW.profile.display_name, app:'command-center'}];
  members.sort((a, b) => (a.id === meId ? -1 : b.id === meId ? 1 : 0));
  const cards = members.map(m => memberCard(m, m.id === meId ? myStatus() : (CREW.statuses.find(s => s.user_id === m.id) || null), m.id === meId)).join('');
  const yn = (key, label) => '<div class="row-between"><span class="small">' + label + '</span><div class="seg seg-sm" role="group">' + [['yes','Yes',true],['no','No',false]].map(([v, l, b]) => '<button type="button" data-act="checkin" data-k="' + key + '" data-v="' + v + '" aria-pressed="' + (myC[key] === b) + '">' + l + '</button>').join('') + '</div></div>';
  const checkin = '<div class="card stack" style="gap:10px"><div><p class="eyebrow">Today · your check-in</p><h2>Check in</h2></div>' + yn('gym', 'Hit the gym') + yn('plan_followed', 'Followed my plan') +
    '<div class="row-between"><span class="small">Top 3 done</span><div class="seg seg-sm" role="group">' + [0, 1, 2, 3].map(n => '<button type="button" data-act="checkin" data-k="top3_done" data-v="' + n + '" aria-pressed="' + (myC.top3_done === n) + '">' + n + '</button>').join('') + '</div></div>' +
    '<input type="text" id="cw_note" data-ch="checkNote" maxlength="280" placeholder="One line for your crew, e.g. 15 Docstar emails out" value="' + esc(myC.note || '') + '"><label class="row small" style="gap:8px"><input type="checkbox" id="cw_money" data-ch="shareMoney" ' + (S.profile.crewShareMoney ? 'checked' : '') + '> Share money stats (month-to-date net)</label></div>';
  const feed = '<div class="card"><div class="card-head"><h2>Nudges</h2></div>' + (CREW.nudges.length ? '<ul class="tasks">' + CREW.nudges.slice(0, 10).map(n => '<li class="task"><span class="mono tiny faint" style="width:66px">' + esc(new Date(n.created_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})) + '</span><span class="small" style="flex:1"><b>' + esc(memberName(n.from_user)) + '</b> → ' + esc(memberName(n.to_user)) + ': ' + esc(nudgeText(n)) + '</span></li>').join('') + '</ul>' : '<div class="empty">No nudges yet.</div>') + '</div>';
  return head + (members.length < 2 ? '<div class="empty" style="margin-bottom:14px">Waiting for your friend to join. Give him the code <b class="mono">' + esc(CREW.crew.invite_code || '') + '</b>.</div>' : '') + '<div class="grid-2" style="align-items:start"><div class="stack">' + checkin + historyHTML(members) + '</div><div class="stack">' + cards + feed + '</div></div>';
}
function memberCard(m, st, isMe) {
  const name = isMe ? 'You' : (m.display_name || 'Crewmate'), tag = m.app === 'trader' ? 'Trader' : 'Command Center';
  if (!st) return '<div class="card"><div class="card-head"><div><p class="eyebrow">' + esc(tag) + '</p><h2>' + esc(name) + '</h2></div></div>' + nudgeBtns(m, isMe) + '<div class="empty" style="margin-top:10px">No check-in yet today.</div></div>';
  const c = st.checkin || {}, s = st.stats || {};
  const mark = (v, l) => '<span class="pill ' + (v === true ? 'good' : v === false ? 'crit' : '') + '">' + l + ' ' + (v === true ? '✓' : v === false ? '✗' : '—') + '</span>';
  const known = {streak_days:'Streak (days)', workouts_week:'Workouts this week', docstar_sent:'Docstar emails sent', docstar_replies:'Replies', docstar_customers:'Customers', docstar_sent_week:'Emails this week', mtd_net:'Month-to-date net', sessions_week:'Trading sessions this week', rules_followed_pct:'Rules followed', trades_today:'Trades today', pnl_today:'P&L today', pnl_week:'P&L this week'};
  const moneyKeys = ['mtd_net', 'pnl_today', 'pnl_week'];
  const kp = Object.keys(s).filter(x => x !== 'share_money' && (s.share_money || !moneyKeys.includes(x)) && (typeof s[x] === 'number' || typeof s[x] === 'string')).slice(0, 8).map(x => { const v = s[x], isM = moneyKeys.includes(x); const disp = isM ? (num(v) > 0 ? '+' : '') + money(v) : x === 'rules_followed_pct' ? Math.round(num(v)) + '%' : String(v); return '<div class="kpi"><div class="v ' + (isM ? (num(v) >= 0 ? 'pos' : 'neg') : '') + '">' + esc(disp) + '</div><div class="l">' + esc(known[x] || x.replace(/_/g, ' ')) + '</div></div>'; }).join('');
  const sched = (Array.isArray(st.schedule) ? st.schedule : []).slice(0, 16).map(b => '<div class="tl"><span class="t">' + esc(fmtTime(String(b.start || '00:00'))).replace(' ', ' ') + '</span><span>' + esc(b.label) + '</span></div>').join('');
  return '<div class="card"><div class="card-head"><div><p class="eyebrow">' + esc(tag) + (st.updated_at && !isMe ? ' · updated ' + esc(new Date(st.updated_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})) : '') + '</p><h2>' + esc(name) + '</h2></div></div>' + nudgeBtns(m, isMe) +
    '<div class="row" style="gap:6px;margin-top:8px">' + mark(c.gym, 'Gym') + mark(c.plan_followed, 'Plan') + '<span class="pill">Top 3 ' + (c.top3_done != null ? esc(c.top3_done) : '—') + '/3</span></div>' + (c.note ? '<p class="small" style="margin-top:8px">“' + esc(c.note) + '”</p>' : '') + (kp ? '<div class="kpis" style="margin-top:12px">' + kp + '</div>' : '') + (sched ? '<details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Schedule today</summary><div class="timeline">' + sched + '</div></details>' : '') + '</div>';
}
function nudgeBtns(m, isMe) { if (isMe) return ''; return '<div class="row" style="gap:6px">' + [['gym','Gym in 10'],['locked_in','Locked in'],['check','You good?']].map(([k, l]) => '<button class="btn btn-sm" data-act="nudge" data-to="' + esc(m.id) + '" data-k="' + k + '">' + l + '</button>').join('') + '</div>'; }
function historyHTML(members) {
  const days = []; for (let i = 6; i >= 0; i--) days.push(addDays(dkey(), -i));
  const meId = CREW.me.id;
  const rowFor = m => { const cells = days.map(d => { let c = null; if (m.id === meId) c = (S.profile.checkins || {})[d]; else { const h = CREW.hist.find(x => x.user_id === m.id && x.date === d) || (d === dkey() ? CREW.statuses.find(x => x.user_id === m.id) : null); c = h && h.checkin; } const v = c && c.plan_followed; return '<span title="' + fmtDate(d) + '" style="width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:.72rem;background:' + (v === true ? 'var(--good-soft)' : v === false ? 'var(--crit-soft)' : 'var(--surface-2)') + ';color:' + (v === true ? 'var(--good)' : v === false ? 'var(--crit)' : 'var(--ink-3)') + ';border:1px solid var(--line)">' + (v === true ? '✓' : v === false ? '✗' : '') + '</span>'; }).join(''); return '<div class="row-between" style="flex-wrap:nowrap"><span class="small" style="min-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.id === meId ? 'You' : (m.display_name || 'Crewmate')) + '</span><div class="row" style="gap:4px;flex-wrap:nowrap">' + cells + '</div></div>'; };
  return '<div class="card stack" style="gap:8px"><div><p class="eyebrow">Last 7 days · followed the plan</p><h2>Who’s locked in</h2></div>' + members.map(rowFor).join('') + '<p class="tiny faint" style="text-align:right">' + fmtDate(days[0]) + ' → today</p></div>';
}
function pruneCheckins() { const C = S.profile.checkins || {}, cut = addDays(dkey(), -90); Object.keys(C).forEach(d => { if (d < cut) delete C[d]; }); }
Object.assign(ACT, {
  checkin:el => { const k = dkey(), C = S.profile.checkins = S.profile.checkins || {}, c = C[k] = C[k] || {}, key = el.dataset.k, v = el.dataset.v; c[key] = key === 'top3_done' ? num(v) : v === 'yes'; c.at = new Date().toISOString(); pruneCheckins(); touch('profile'); },
  nudge:async el => { if (!CREW.api || !CREW.crew) return; el.disabled = true; try { await CREW.api.nudge(CREW.crew.id, el.dataset.to, el.dataset.k, NUDGES[el.dataset.k] || ''); toast('Sent'); } catch (e) { toast('Couldn’t send that nudge.'); } finally { el.disabled = false; } },

});
Object.assign(CH, {
  checkNote:el => { const k = dkey(), C = S.profile.checkins = S.profile.checkins || {}, c = C[k] = C[k] || {}; c.note = el.value.slice(0, 280); c.at = new Date().toISOString(); touch('profile'); },
  shareMoney:el => { S.profile.crewShareMoney = el.checked; touch('profile'); }
});
Object.assign(FORM, {
  crewName:async () => { const n = $('#cw_name').value.trim(); if (!n) return; try { await CREW.api.setProfile(n); CREW.profile = await CREW.api.getProfile(); if (!CREW.crew) await loadCrews(); } catch (e) { toast('Couldn’t save your name.'); } render(); },
  crewCreate:async () => { const n = $('#cw_cname').value.trim() || 'Locked In'; try { await CREW.api.createCrew(n); await loadCrews(); toast('Crew created. Send your friend the code.'); } catch (e) { toast('Couldn’t create the crew. Check the database setup.'); } render(); },
  crewJoin:async () => { const c = $('#cw_code').value.trim(); if (!c) return; try { await CREW.api.joinCrew(c); await loadCrews(); toast('You’re in.'); } catch (e) { toast('That code didn’t work.'); } render(); }
